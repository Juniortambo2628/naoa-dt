<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- Fonts loaded locally in index.css -->
    
    <title>Dinah & Tze Ren | Wedding</title>
    <meta name="description" content="Join us in celebrating our love - Dinah & Tze Ren Wedding, June 15th, 2025" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Restore viewport zoom after pinch gesture on mobile
      (function() {
        let lastTouchEnd = 0;
        let viewportMeta = document.querySelector('meta[name="viewport"]');
        
        document.addEventListener('touchstart', function(e) {
          if (e.touches.length > 1) {
            // Multi-touch detected (pinch gesture starting)
            lastTouchEnd = Date.now();
          }
        }, { passive: true });
        
        document.addEventListener('touchend', function(e) {
          const now = Date.now();
          if (now - lastTouchEnd < 300) {
            // Pinch gesture just ended, reset viewport
            setTimeout(function() {
              if (viewportMeta) {
                viewportMeta.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no');
              }
            }, 100);
          }
          lastTouchEnd = now;
        }, { passive: true });
        
        // Also handle orientation change
        window.addEventListener('orientationchange', function() {
          setTimeout(function() {
            if (viewportMeta) {
              viewportMeta.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no');
            }
          }, 500);
        });
      })();
    </script>
  </body>
</html>
