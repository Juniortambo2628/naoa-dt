<title>Digital Invite Tour</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one 9:16 "film" stage, centred in a dark frame; the 3D scene fills the
   stage and the words sit on top of it, sized in stage units so the tour looks
   the same on a phone, a laptop and in the exported video. */
:root {
  --frame: #1f1915;        /* around the stage on wide screens */
  --ivory: #FBF8F3;        /* invitation paper */
  --ink: #3E332B;          /* headline ink */
  --cinnamon: #9B4621;     /* the couple's accent */
  --gold: #B8936C;         /* monogram / labels */
  --muted: #8B7B6B;
  --font-display: 'Cormorant Garamond', 'Iowan Old Style', Georgia, serif;
  --font-script: 'Great Vibes', 'Snell Roundhand', 'Brush Script MT', cursive;
  --font-body: 'Lato', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--frame); color: var(--ink);
  display: grid; place-items: center; overflow: hidden;
  padding-left: max(0px, env(safe-area-inset-left, 0px));
  padding-right: max(0px, env(safe-area-inset-right, 0px));
  font-family: var(--font-body);
  -webkit-tap-highlight-color: transparent;
}
#stage {
  position: relative; container-type: size;
  height: min(100%, calc(100vw * 16 / 9)); aspect-ratio: 9 / 16; max-width: 100%;
  background: var(--ivory); overflow: hidden; touch-action: pan-y;
  box-shadow: 0 30px 120px rgba(0,0,0,.45);
}
#mono2d { position: absolute; width: auto; max-width: none; transform: translate(-50%, -50%); pointer-events: none; filter: drop-shadow(0 1.2cqw 2.4cqw rgba(120,86,52,.18)); }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* Kinetic type */
.copy { position: absolute; left: 0; right: 0; text-align: center; pointer-events: none; padding: 0 6cqw; }
.copy.top { top: 6.2cqh; }
.copy.bottom { top: 68cqh; }
.eyebrow {
  font: 700 2.55cqw/1 var(--font-body); letter-spacing: .32em; text-transform: uppercase;
  color: var(--gold); margin: 0 0 2.2cqw; display: inline-flex; align-items: center; gap: 2.2cqw;
}
.eyebrow::before, .eyebrow::after { content: ""; width: 6cqw; height: 1px; background: currentColor; opacity: .6; }
.line { display: block; margin: 0; }
.serif { font: 500 8.4cqw/1.02 var(--font-display); color: var(--ink); letter-spacing: -.01em; }
.script { font: 400 11.6cqw/1.05 var(--font-script); color: var(--cinnamon); margin-top: .4cqw; }
.small { font: 400 3.1cqw/1.4 var(--font-body); color: var(--muted); letter-spacing: .04em; margin-top: 2.6cqw; }
.w { display: inline-block; white-space: pre; will-change: transform, opacity, filter; }

/* Controls (hidden in the exported video) */
.ui { position: absolute; z-index: 5; }
#sound {
  top: calc(3.2cqw + env(safe-area-inset-top, 0px)); right: 3.2cqw;
  display: inline-flex; align-items: center; gap: 1.6cqw;
  padding: 1.6cqw 2.8cqw; border-radius: 999px; border: 1px solid rgba(255,255,255,.8);
  background: rgba(255,255,255,.62); backdrop-filter: blur(14px) saturate(1.6); -webkit-backdrop-filter: blur(14px) saturate(1.6);
  color: var(--ink); font: 700 2.5cqw/1 var(--font-body); letter-spacing: .08em; text-transform: uppercase;
  box-shadow: 0 6px 24px rgba(74,63,53,.16); cursor: pointer;
}
#sound svg { width: 3.4cqw; height: 3.4cqw; }
#sound:focus-visible, .chap:focus-visible, #play:focus-visible { outline: 2px solid var(--cinnamon); outline-offset: 2px; }
#bar {
  left: 4cqw; right: 4cqw; bottom: calc(3.4cqw + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 2.4cqw;
}
#play {
  flex: none; width: 7.4cqw; height: 7.4cqw; border-radius: 50%; border: 1px solid rgba(255,255,255,.85);
  background: rgba(255,255,255,.62); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  display: grid; place-items: center; color: var(--ink); cursor: pointer; padding: 0;
}
#play svg { width: 3.2cqw; height: 3.2cqw; }
#chapters { flex: 1; display: flex; gap: .9cqw; min-width: 0; }
.chap { flex: 1; height: 5cqw; padding: 0; border: 0; background: none; cursor: pointer; position: relative; }
.chap i { position: absolute; left: 0; right: 0; top: 50%; height: .7cqw; margin-top: -.35cqw; border-radius: 1cqw; background: rgba(62,51,43,.16); overflow: hidden; }
.chap b { position: absolute; inset: 0; width: 0; background: var(--cinnamon); }
#chapname {
  position: absolute; left: 0; right: 0; bottom: calc(10.4cqw + env(safe-area-inset-bottom, 0px)); text-align: center;
  font: 700 2.2cqw/1 var(--font-body); letter-spacing: .3em; text-transform: uppercase; color: var(--muted); opacity: .85; pointer-events: none;
}
#loading {
  position: absolute; inset: 0; display: grid; place-items: center; z-index: 6;
  font: 500 5cqw/1 var(--font-display); color: var(--gold); background: var(--ivory); transition: opacity .6s;
}
body.render .ui, body.render #chapname { display: none !important; }
@media (prefers-reduced-motion: reduce) { .w { filter: none !important; } }
</style>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const RENDER = new URLSearchParams(location.search).has('render');
if (RENDER) document.body.classList.add('render');
const LOOP = 30;                   // seconds: 12 bars at 96 BPM
const BAR = 2.5;

/* ---------------------------------------------------------------- script */
// Each chapter is one bar of music. Copy is short enough to read in a glance.
const SCENES = [
  { id: 'intro',    name: 'Welcome',      t0: 0,    t1: 2.15,  pos: 'bottom', eyebrow: 'Dinah & Tze Ren', lines: [['serif', 'Your Digital Invite'], ['script', 'Guide']] },
  { id: 'open',     name: 'Opening',      t0: 2.5,  t1: 5,    eyebrow: 'Made for you',   lines: [['serif', 'It opens'], ['script', 'just for you']] },
  { id: 'details',  name: 'Details',      t0: 5,    t1: 7.5,  eyebrow: 'All the details', lines: [['serif', 'When, where &'], ['script', 'good to know']] },
  { id: 'rsvp',     name: 'RSVP',         t0: 7.5,  t1: 10,   eyebrow: 'RSVP',           lines: [['serif', 'Reply in'], ['script', 'a few taps']] },
  { id: 'pass',     name: 'Entry pass',   t0: 10,   t1: 12.5, eyebrow: 'Entry pass',     lines: [['serif', 'Your QR,'], ['script', 'ready at the door']] },
  { id: 'live',     name: 'Programme',    t0: 12.5, t1: 15,   eyebrow: 'Live programme', lines: [['serif', 'Follow the day'], ['script', 'as it happens']] },
  { id: 'moments',  name: 'Moments',      t0: 15,   t1: 17.5, eyebrow: 'Snap & stories', lines: [['serif', 'Snap polaroids,'], ['script', 'share stories']] },
  { id: 'gift',     name: 'Gifts',        t0: 17.5, t1: 20,   eyebrow: 'Gifts',          lines: [['serif', 'Send a gift'], ['script', 'with M-Pesa']] },
  { id: 'more',     name: 'And more',     t0: 20,   t1: 22.5, eyebrow: 'Find your way',  lines: [['serif', 'Directions, dress code'], ['script', '& so much more']] },
  { id: 'home',     name: 'Home screen',  t0: 22.5, t1: 25,   eyebrow: 'One tap away',   lines: [['serif', 'Add it to'], ['script', 'your home screen']] },
  { id: 'pocket',   name: 'Finale',       t0: 25,   t1: 27.8, eyebrow: 'Your invitation', lines: [['serif', 'Everything for the day,'], ['script', 'in your pocket']] },
  { id: 'outro',    name: 'Finale',       t0: 28.2, t1: 29.75, pos: 'bottom', chapter: false, lines: [['script', 'See you there'], ['small', '14 November 2026']] },
];
const CHAPTERS = SCENES.filter(s => s.chapter !== false);

/* --------------------------------------------------------------- helpers */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const easeOut = t => 1 - Math.pow(1 - t, 3);

const seg = (t, a, b) => clamp((t - a) / (b - a));

/* ---------------------------------------------------------------- images */
const SHOTS = {};
const names = [];
for (let i = 0; i < 40; i++) names.push(`env_${String(i).padStart(2, '0')}`);
for (let i = 0; i < 26; i++) names.push(`det_${String(i).padStart(2, '0')}`);
for (let i = 0; i < 20; i++) names.push(`prog_${String(i).padStart(2, '0')}`);
names.push('rsvp_a', 'rsvp_b', 'rsvp_c', 'pass_0', 'pass_1', 'gift_0', 'gift_1', 'gift_2', 'gift_3', 'snap_1', 'storyB_1', 'tray',
  'directions', 'dress_code', 'location_1', 'homescreen');
// Where each tapped control sits on its screen (0..1 of the page area), measured by tools/capture.cjs.
let TAPS = { pass: [.27, .94], home: [.5, .45], gift_sent: [.5, .73], gift_amount: [.3, .39], snap: [.5, .91], rsvp: [.32, .52], story: [.14, .48] };
const loadTaps = () => fetch('screens/taps.json').then(r => (r.ok ? r.json() : null)).then(j => { if (j) TAPS = { ...TAPS, ...j }; }).catch(() => {});
const loadImg = n => new Promise((res) => {
  const im = new Image(); im.decoding = 'async';
  im.onload = () => { SHOTS[n] = im; res(); };
  im.onerror = () => res();
  im.src = `screens/${n}.jpg`;
});

/* ----------------------------------------------------------------- three */
const stage = document.getElementById('stage');
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: RENDER, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, RENDER ? 2 : 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 9 / 16, 0.1, 100);
camera.position.set(0, 0, 16); camera.updateMatrixWorld();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

scene.add(new THREE.AmbientLight(0xfff4e6, 0.5));
const key = new THREE.DirectionalLight(0xfff1dc, 1.6); key.position.set(3, 5, 8); scene.add(key);
const rim = new THREE.DirectionalLight(0xffd9b0, 0.9); rim.position.set(-6, 2, -3); scene.add(rim);

// Background: invitation paper with a slow warm light, the diamond lattice from the couple's strip, and grain.
const bgMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 }, uAspect: { value: 9 / 16 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `
    varying vec2 vUv; uniform float uTime; uniform float uAspect;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
    void main(){
      vec2 uv = vUv; vec2 p = vec2((uv.x-.5)*uAspect, uv.y-.5);
      float a = uTime * 6.2831853 / 30.0;                       // one full cycle per loop
      vec3 paper = mix(vec3(0.953,0.922,0.875), vec3(0.988,0.976,0.953), smoothstep(-.7,.5,p.y));
      vec2 c1 = vec2(.22*sin(a), .16+.10*cos(a));
      vec2 c2 = vec2(-.20*cos(a*2.0), -.22+.08*sin(a));
      paper += vec3(1.0,.86,.62) * .10 * exp(-dot(p-c1,p-c1)*9.0);
      paper += vec3(.61,.27,.13) * .05 * exp(-dot(p-c2,p-c2)*7.0);
      // diamond lattice, fading towards the centre
      vec2 q = p * 13.0; q = vec2(q.x+q.y, q.x-q.y);
      vec2 g = abs(fract(q) - .5);
      float line = 1.0 - smoothstep(.0, .035, min(g.x, g.y));
      float edge = smoothstep(.18, .62, length(p*vec2(1.0,.8)));
      paper = mix(paper, vec3(.72,.58,.42), line * .10 * edge);
      paper -= (1.0-smoothstep(.35,.95,1.0-length(p*vec2(1.25,1.0)))) * .06;  // soft vignette
      paper += (hash(uv*1000.0 + floor(uTime*24.0)) - .5) * .018;
      gl_FragColor = vec4(paper, 1.0);
    }`,
  depthWrite: false,
});
const bg = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), bgMat);
bg.position.z = -12; bg.renderOrder = -1; scene.add(bg);
{
  const d = camera.position.z - bg.position.z, h = 2 * d * Math.tan(THREE.MathUtils.degToRad(15));
  bg.scale.set(h * 9 / 16 * 1.02, h * 1.02, 1);
}

// Gold dust
const DUST = 260;
const dustGeo = new THREE.BufferGeometry();
const dpos = new Float32Array(DUST * 3), dseed = new Float32Array(DUST * 4);
for (let i = 0; i < DUST; i++) {
  const r = (n) => { const x = Math.sin(i * 12.9898 + n * 78.233) * 43758.5453; return x - Math.floor(x); };
  dseed.set([r(1), r(2), r(3), r(4)], i * 4);
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dpos, 3));
dustGeo.setAttribute('seed', new THREE.BufferAttribute(dseed, 4));
const dustMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false,
  uniforms: { uTime: { value: 0 }, uPx: { value: 1 }, uBurst: { value: 0 } },
  vertexShader: `
    attribute vec4 seed; uniform float uTime; uniform float uPx; uniform float uBurst; varying float vA;
    void main(){
      float a = uTime * 6.2831853 / 30.0;
      float rise = fract(seed.y + uTime / 30.0 * (1.0 + floor(seed.w*2.0)));   // whole loops: seamless
      vec3 p = vec3((seed.x-.5)*6.4 + .25*sin(a*2.0 + seed.z*6.28), (rise-.5)*10.0, -7.0 + seed.z*9.0);
      vec4 mv = modelViewMatrix * vec4(p,1.0);
      gl_Position = projectionMatrix * mv;
      float tw = .55 + .45*sin(a*4.0 + seed.w*40.0);
      vA = tw * smoothstep(0.0,.12,rise) * (1.0-smoothstep(.85,1.0,rise)) * (.45 + uBurst*.55);
      gl_PointSize = uPx * (1.5 + seed.z*5.5) * (14.0 / -mv.z);
    }`,
  fragmentShader: `varying float vA; void main(){ vec2 c = gl_PointCoord-.5; float d = length(c); float s = smoothstep(.5,.0,d); gl_FragColor = vec4(vec3(.80,.62,.38), s*s*vA); }`,
});
scene.add(new THREE.Points(dustGeo, dustMat));

// Monogram: the couple's T&D, flat and crisp (the same 2D mark the invitation uses),
// placed where a point in the 3D scene projects so it moves with the camera.
const mono = new THREE.Object3D();
const monoEl = document.getElementById('mono2d');
async function buildMonogram() { if (monoEl.decode) { try { await monoEl.decode(); } catch (e) { /* drawn when loaded */ } } }

// Soft contact shadow
function radialTex(inner = 'rgba(70,50,35,.34)') {
  const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d');
  const gr = g.createRadialGradient(128, 128, 0, 128, 128, 128); gr.addColorStop(0, inner); gr.addColorStop(1, 'rgba(70,50,35,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 256, 256); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const shadowTex = radialTex();

/* ------------------------------------------------------------------ phone */
// An iPhone: flat titanium band with rounded corners, thin even bezels, a
// status bar and the Dynamic Island. It stays still; only its screen moves.
const SW = 585, SH = 1266;            // screen texture: 1.5x a 390 x 844pt iPhone screen
const STATUS = 81;                    // 54pt status bar, drawn by the tour
const PAGE_H = SH - STATUS;           // the captured page area (390 x 790pt)
const SCR_W = 2.24, SCR_H = SCR_W * SH / SW;
const BEZEL = 0.08, PW = SCR_W + 2 * BEZEL, PH = SCR_H + 2 * BEZEL, PD = 0.28;
function roundedRectShape(w, h, r) {
  const s = new THREE.Shape(), x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y); return s;
}
function shapeGeo(w, h, r) {
  const g = new THREE.ShapeGeometry(roundedRectShape(w, h, r), 24);
  const pos = g.attributes.position, uv = g.attributes.uv;
  for (let i = 0; i < pos.count; i++) uv.setXY(i, pos.getX(i) / w + .5, pos.getY(i) / h + .5);
  return g;
}
const frameMat = new THREE.MeshPhysicalMaterial({ color: 0xc9b59a, metalness: 1, roughness: 0.38, clearcoat: 0.3, envMapIntensity: 1.1, transparent: true });
const blackMat = new THREE.MeshStandardMaterial({ color: 0x0a0909, roughness: 0.3, metalness: 0.1, transparent: true });
const screenMat = new THREE.MeshBasicMaterial({ toneMapped: false, transparent: true });
const glassMat = new THREE.MeshPhysicalMaterial({ color: 0x000000, roughness: 0.04, metalness: 0, transparent: true, opacity: 0.04, clearcoat: 1, envMapIntensity: 1.2, depthWrite: false });

function makePhone() {
  const g = new THREE.Group();
  const bodyGeo = new THREE.ExtrudeGeometry(roundedRectShape(PW - 0.04, PH - 0.04, 0.42), { depth: PD - 0.04, bevelEnabled: true, bevelThickness: 0.02, bevelSize: 0.02, bevelSegments: 3, curveSegments: 32 });
  bodyGeo.translate(0, 0, -(PD - 0.04) / 2);
  g.add(new THREE.Mesh(bodyGeo, frameMat));
  const face = new THREE.Mesh(shapeGeo(PW - 0.05, PH - 0.05, 0.41), blackMat); face.position.z = PD / 2 + 0.002; g.add(face);
  const cvs = document.createElement('canvas'); cvs.width = SW; cvs.height = SH;
  const tex = new THREE.CanvasTexture(cvs); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  tex.minFilter = THREE.LinearMipmapLinearFilter; tex.generateMipmaps = true;
  screenMat.map = tex;
  const screen = new THREE.Mesh(shapeGeo(SCR_W, SCR_H, 0.34), screenMat); screen.position.z = PD / 2 + 0.004; g.add(screen);
  const glass = new THREE.Mesh(shapeGeo(PW - 0.05, PH - 0.05, 0.41), glassMat); glass.position.z = PD / 2 + 0.008; g.add(glass);
  // Side buttons: action button and volume on the left, side button on the right.
  const btn = (h) => new THREE.Mesh(new THREE.BoxGeometry(0.035, h, 0.11), frameMat);
  [[-1, 1.42, 0.2], [-1, 0.95, 0.42], [-1, 0.42, 0.42], [1, 0.95, 0.62]].forEach(([side, y, h]) => { const b = btn(h); b.position.set(side * (PW / 2 + 0.012), y, 0); g.add(b); });
  const sh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false, toneMapped: false }));
  g.userData = { cvs, ctx: cvs.getContext('2d'), tex, shadow: sh };
  return g;
}
const phone = makePhone(); scene.add(phone);
scene.add(phone.userData.shadow); phone.userData.shadow.rotation.x = -Math.PI / 2.6;
function setPhoneOpacity(a) { frameMat.opacity = blackMat.opacity = screenMat.opacity = a; glassMat.opacity = 0.04 * a; phone.visible = a > 0.002; }

/* ------------------------------------------------------- screen drawing */
// The colour along the top of each screen, so the status bar blends with the page.
const TOP = {};
function topColor(name) {
  if (TOP[name]) return TOP[name];
  const im = SHOTS[name]; if (!im) return '#FBF8F3';
  const c = document.createElement('canvas'); c.width = 8; c.height = 1; const g = c.getContext('2d');
  g.drawImage(im, 0, 0, im.naturalWidth, 6, 0, 0, 8, 1);
  const d = g.getImageData(0, 0, 8, 1).data; let r = 0, gg = 0, b = 0;
  for (let i = 0; i < 32; i += 4) { r += d[i]; gg += d[i + 1]; b += d[i + 2]; }
  r /= 8; gg /= 8; b /= 8;
  return (TOP[name] = { css: `rgb(${r | 0},${gg | 0},${b | 0})`, dark: 0.299 * r + 0.587 * gg + 0.114 * b < 128 });
}
let statusTop = null;                  // what the status bar sits on (set by the last full-screen draw)
function cover(ctx, name, dx = 0, dy = 0, alpha = 1, scale = 1) {

/* ------------------------------------------------------------ choreography */
// The phone holds one pose for the whole tour and only fades in and out

const PHONE_POSE = { x: 0, y: -.94, z: 0, rx: .02, ry: -.12, scale: 1.12 };

/* ------------------------------------------------------------ kinetic copy */
const copyRoot = document.getElementById('copy');

  s.lines.forEach(([cls, text]) => {

    text.split(' ').forEach((w, i, arr) => { const sp = document.createElement('span'); sp.className = 'w'; sp.textContent = w + (i < arr.length - 1 ? ' ' : ''); line.appendChild(sp); words.push(sp); });

/* ------------------------------------------------------------------ frame */
function frame(t) {
  t = mod(t, LOOP);
  bgMat.uniforms.uTime.value = t; dustMat.uniforms.uTime.value = t;
  dustMat.uniforms.uBurst.value = Math.max(seg(t, 0, .4) * (1 - seg(t, 2, 2.6)), seg(t, 27.6, 28.8));
  const op = ease(phoneOpacity(t));
  setPhoneOpacity(op);
  phone.position.set(PHONE_POSE.x, PHONE_POSE.y, PHONE_POSE.z); phone.scale.setScalar(PHONE_POSE.scale);
  phone.rotation.set(PHONE_POSE.rx, PHONE_POSE.ry, 0);
  if (op > 0) drawMain(t);
  const sh = phone.userData.shadow;
  sh.visible = op > 0; sh.position.set(0, -3.95, -.4); sh.scale.set(3.8 * PHONE_POSE.scale, 1.5 * PHONE_POSE.scale, 1); sh.material.opacity = op;

  const M = sample(MONO_KEYS, t);
  mono.position.set(M[1], M[2] + Math.sin(t * 2 * Math.PI / 7.5) * .04, M[3]);
  const v = mono.position.clone().project(camera);
  const depth = camera.position.z - mono.position.z;
  const hFrac = 3.1 * M[5] * (1 + .015 * Math.sin(t * 2 * Math.PI / 5)) / (2 * depth * Math.tan(THREE.MathUtils.degToRad(15)));
  monoEl.style.visibility = M[6] > 0.01 ? 'visible' : 'hidden';
  monoEl.style.opacity = M[6].toFixed(3);
  monoEl.style.left = `${((v.x + 1) / 2 * 100).toFixed(3)}%`;
  monoEl.style.top = `${((1 - v.y) / 2 * 100).toFixed(3)}%`;
  monoEl.style.height = `${(hFrac * 100).toFixed(3)}cqh`;

  updateCopy(t);
  renderer.render(scene, camera);
}

/* ---------------------------------------------------------------- sizing */
function resize() {
  const r = stage.getBoundingClientRect();
  renderer.setSize(r.width, r.height, false);

}
new ResizeObserver(resize).observe(stage); resize();

/* ------------------------------------------------------------------ clock */
let audioCtx = null, buffer = null, src = null, gain = null;
let playing = true, soundOn = false, base = performance.now() / 1000, offset = 0, pausedAt = 0;

}

}

}

const soundBtn = document.getElementById('sound'), soundLabel = document.getElementById('sound-label'), wave = document.getElementById('snd-wave');
soundBtn.addEventListener('click', async () => {

  soundBtn.setAttribute('aria-pressed', String(soundOn));

});
const playBtn = document.getElementById('play');

// Chapter strip: jump to any feature.
const chapWrap = document.getElementById('chapters'), chapName = document.getElementById('chapname');

});
const chapEnd = (i) => (i < CHAPTERS.length - 1 ? CHAPTERS[i + 1].t0 : LOOP);
function updateChapters(t) {

window.addEventListener('keydown', (e) => {

  }
});

/* ------------------------------------------------------------------- boot */
async function boot() {
  await Promise.all([document.fonts.ready, buildMonogram(), loadTaps(), ...names.map(loadImg)]);
  try { await Promise.all(['500 40px "Cormorant Garamond"', '40px "Great Vibes"', '700 20px Lato', '400 20px Lato'].map(f => document.fonts.load(f))); } catch (e) { /* fallback fonts */ }
  document.getElementById('loading').style.opacity = '0';
  setTimeout(() => document.getElementById('loading').remove(), 700);
  if (RENDER) { window.__renderAt = (t) => frame(t); window.__ready = true; return; }
  base = performance.now() / 1000;
  const loop = () => {
    const t = now(); frame(t); updateChapters(t);
    requestAnimationFrame(loop);
  };
  loop();
}
boot();
</script>
