name: Deploy to VPS

# Deploys to the Hestia VPS with the OKJT deploy-kit (release folders +
# atomic switch). Staging goes first, production follows it, so a broken
# build never reaches the live domain.
#
# This runs after "CI" is green on main (same pattern as the cPanel
# workflow it will replace at cutover) and can be run by hand.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  staging:
    name: Deploy staging
    runs-on: ubuntu-latest
    # Deploy only when CI passed (workflow_run) or when dispatched by hand.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    uses: Juniortambo2628/OKJT/.github/workflows/deploy-laravel.yml@main
    with:
      domain: staging.dntwed.okjtech.co.ke
      app_name: dntwed-staging
      app_dir: backend
      spa_dir: frontend
      build_assets: false
      health_path: /up
      # public/uploads must survive releases:154 of its files are tracked by
      # git, so a fresh checkout would shadow (and then lose) live uploads.
      # Point the release's public/uploads at the shared storage instead.
      post_migrate: mkdir -p $APP_ROOT/shared/storage/app/public/uploads && rm -rf public/uploads && ln -sfn $APP_ROOT/shared/storage/app/public/uploads public/uploads
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      ENV_FILE: ${{ secrets.STAGING_ENV }}
      SPA_ENV: ${{ secrets.SPA_ENV }}

  production:
    name: Deploy production
    runs-on: ubuntu-latest
    needs: staging
    uses: Juniortambo2628/OKJT/.github/workflows/deploy-laravel.yml@main
    with:
      domain: dntwed.okjtech.co.ke
      app_name: dntwed
      app_dir: backend
      spa_dir: frontend
      build_assets: false
      health_path: /up
      post_migrate: mkdir -p $APP_ROOT/shared/storage/app/public/uploads && rm -rf public/uploads && ln -sfn $APP_ROOT/shared/storage/app/public/uploads public/uploads
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      ENV_FILE: ${{ secrets.PROD_ENV }}
      SPA_ENV: ${{ secrets.SPA_ENV }}
