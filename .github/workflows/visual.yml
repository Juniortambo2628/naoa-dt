name: Visual tests

# Playwright screenshot tests for the admin (API is mocked, no backend needed).
# Kept separate from CI so a screenshot difference never blocks a deploy.
#
# Runs on pull requests, nightly, and on demand. Run it manually with
# "update baselines" ticked to regenerate the screenshots on GitHub's runner
# and commit them to the chosen branch (use after an intentional UI change).

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/visual.yml'
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      update:
        description: 'Update baselines and commit them to this branch'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    name: Playwright visual tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run visual tests
        if: ${{ !inputs.update }}
        run: npm run test:visual

      - name: Update baselines
        if: ${{ inputs.update }}
        run: npm run test:visual:update

      - name: Commit updated baselines
        if: ${{ inputs.update }}
        run: |
          if git diff --quiet -- tests/visual/__screenshots__; then
            echo "Baselines already up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tests/visual/__screenshots__
            git commit -m "test(visual): update baselines from CI runner [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/tests/visual/test-results
          retention-days: 7
