name: Deploy Backend to cPanel

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    name: Deploy Laravel Backend
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # Package backend into a tarball, excluding .env
    - name: Create deployment archive
      run: |
        tar -czf backend-deploy.tar.gz \
          --exclude='.env' \
          -C backend .

    # Upload the archive to the server via SCP
    - name: Upload archive to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SFTP_HOST }}
        username: ${{ secrets.SFTP_USERNAME }}
        key: ${{ secrets.SFTP_SSH_KEY }}
        port: 1624
        source: "backend-deploy.tar.gz"
        target: "/home/zhpebukm/"

    # SSH in and deploy the files
    - name: Deploy on server
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.SFTP_HOST }}
        username: ${{ secrets.SFTP_USERNAME }}
        key: ${{ secrets.SFTP_SSH_KEY }}
        port: 1624
        script: |
          set -e
          CORE="/home/zhpebukm/naoa-core"
          PUBLIC="/home/zhpebukm/dnt-wed.okjtech.co.ke/api/public"
          ARCHIVE="/home/zhpebukm/backend-deploy.tar.gz"

          # Ensure directories exist
          mkdir -p "$CORE" "$PUBLIC"
          mkdir -p "$CORE/storage/app/public/uploads"
          mkdir -p "$CORE/storage/app/public/illustrations"

          # Backup .env if it exists
          [ -f "$CORE/.env" ] && cp "$CORE/.env" /tmp/.env.deploy.bak

          # Clean core directory (preserve storage dir and .env)
          cd "$CORE"
          find . -mindepth 1 -maxdepth 1 \
            ! -name 'storage' \
            ! -name '.env' \
            -exec rm -rf {} +

          # Extract new code
          tar -xzf "$ARCHIVE" -C "$CORE"

          # Restore .env (or use production.env as fallback)
          if [ -f /tmp/.env.deploy.bak ]; then
            mv /tmp/.env.deploy.bak "$CORE/.env"
          elif [ -f "$CORE/production.env" ] && [ ! -f "$CORE/.env" ]; then
            cp "$CORE/production.env" "$CORE/.env"
          fi

          # Ensure bootstrap/cache directory exists (required by Laravel)
          mkdir -p "$CORE/bootstrap/cache"

          # Ensure storage directory structure exists
          mkdir -p "$CORE/storage/framework/cache/data"
          mkdir -p "$CORE/storage/framework/sessions"
          mkdir -p "$CORE/storage/framework/views"
          mkdir -p "$CORE/storage/logs"

          # Fix permissions
          chmod -R 755 "$CORE/storage"
          chmod -R 755 "$CORE/bootstrap/cache"

          # Deploy public assets to web root
          cp -R "$CORE/public/." "$PUBLIC/"
          [ -f "$CORE/public/.htaccess" ] && cp "$CORE/public/.htaccess" "$PUBLIC/"

          # Ensure storage symlink
          ln -sf "$CORE/storage/app/public" "$PUBLIC/storage"

          # Clear Laravel caches (use php from cPanel)
          cd "$CORE"
          php artisan config:clear 2>/dev/null || true
          php artisan cache:clear 2>/dev/null || true
          php artisan route:clear 2>/dev/null || true
          php artisan view:clear 2>/dev/null || true

          # Rebuild config cache for production performance
          php artisan config:cache 2>/dev/null || true
          php artisan route:cache 2>/dev/null || true

          # Clean up archive
          rm -f "$ARCHIVE"

          echo "✅ Backend deployment complete!"

    # NOTE: Storage symlink must exist on server:
    # ln -s /home/zhpebukm/naoa-core/storage/app/public /home/zhpebukm/dnt-wed.okjtech.co.ke/api/public/storage
    # Uploads are stored in: /home/zhpebukm/naoa-core/storage/app/public/uploads/
    # Served via: https://api-dntwed.okjtech.co.ke/storage/uploads/...
